<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <ul>
        <li><h2>To Buy:</h2></li>
        <li>Bhindi</li>
        <li>Kalingr</li>
        <li>Ghee</li>
    </ul>
    <ol>
        <li>Bhindi</li>
        <li>Kalingr</li>
    </ol>
    <ol type= "a">
        <li>Bhindi</li>
        <li>Kalingr</li>
    </ol>
</body>
</html>
